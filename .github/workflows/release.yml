name: Release

on:
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: "Publish to npm after checks"
        type: boolean
        default: false
      npm_dist_tag:
        description: "npm dist-tag to publish under (for example: latest, next)"
        required: false
        default: "latest"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version (${TAG_VERSION}) does not match package.json version (${PACKAGE_VERSION})"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Release smoke
        run: bun run release:smoke

  package:
    name: Package Artifact
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package_file: ${{ steps.pack.outputs.package_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build:web

      - name: Packaging guard
        run: bun run pack:check:fast

      - name: Create npm tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          PACK_OUTPUT="$(npm pack --silent)"
          echo "${PACK_OUTPUT}"
          PACKAGE_FILE="$(printf '%s\n' "${PACK_OUTPUT}" | tail -n 1 | tr -d '\r')"
          if [[ -z "${PACKAGE_FILE}" || ! -f "${PACKAGE_FILE}" ]]; then
            echo "Unable to resolve npm pack output file"
            exit 1
          fi
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
          shasum -a 256 "${PACKAGE_FILE}" > "${PACKAGE_FILE}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            ${{ steps.pack.outputs.package_file }}
            ${{ steps.pack.outputs.package_file }}.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/*.tgz.sha256

  publish-npm:
    name: Publish To npm
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify trusted-publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          echo "node=${NODE_VERSION}"
          echo "npm=${NPM_VERSION}"
          node -e "const parse=(v)=>v.replace(/^v/,'').split('.').map((n)=>Number.parseInt(n,10)||0); const gte=(a,b)=>{for(let i=0;i<3;i++){if((a[i]??0)>(b[i]??0)) return true; if((a[i]??0)<(b[i]??0)) return false;} return true;}; const node=parse(process.argv[1]); const npm=parse(process.argv[2]); if(!gte(node,[22,14,0])){console.error('Trusted publishing requires Node >=22.14.0'); process.exit(1);} if(!gte(npm,[11,5,1])){console.error('Trusted publishing requires npm >=11.5.1'); process.exit(1);} " "${NODE_VERSION}" "${NPM_VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build:web

      - name: Packaging guard
        run: bun run pack:check:fast

      - name: Clean npm auth context (trusted publishing)
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${HOME}/.npmrc"
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" ]]; then
            rm -f "${NPM_CONFIG_USERCONFIG}"
          fi
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          unset NPM_CONFIG_USERCONFIG || true
          unset npm_config_userconfig || true

      - name: Publish package
        run: npm publish --provenance --access public --tag "${{ inputs.npm_dist_tag }}"
